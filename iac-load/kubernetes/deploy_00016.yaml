apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-svc-00150
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-svc-00150
  template:
    metadata:
      labels:
        app: legacy-svc-00150
    spec:
      hostNetwork: true
      containers:
        - name: legacy-svc-00150
          image: legacy-registry/legacy-svc-00150:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
