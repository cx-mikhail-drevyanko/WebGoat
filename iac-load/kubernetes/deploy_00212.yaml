apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-svc-02110
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-svc-02110
  template:
    metadata:
      labels:
        app: legacy-svc-02110
    spec:
      hostNetwork: true
      containers:
        - name: legacy-svc-02110
          image: legacy-registry/legacy-svc-02110:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
