apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-svc-01500
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-svc-01500
  template:
    metadata:
      labels:
        app: legacy-svc-01500
    spec:
      hostNetwork: true
      containers:
        - name: legacy-svc-01500
          image: legacy-registry/legacy-svc-01500:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
