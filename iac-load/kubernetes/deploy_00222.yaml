apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-svc-02210
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-svc-02210
  template:
    metadata:
      labels:
        app: legacy-svc-02210
    spec:
      hostNetwork: true
      containers:
        - name: legacy-svc-02210
          image: legacy-registry/legacy-svc-02210:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
